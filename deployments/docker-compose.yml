services:
  graft:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - ../.env
    environment:
      DB_PATH: /data/rules.db
    volumes:
      - graft-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  graft-data:
